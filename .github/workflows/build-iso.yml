name: Build ISO

on:
  workflow_dispatch:
    inputs:
      desktop:
        description: Desktop environment (xfce, gnome, kde, none)
        default: xfce
      base:
        description: Base distribution (debian, kali)
        default: debian
      tools:
        description: Tool categories, space separated
        default: recon web passwords wireless sniffing exploit forensics reversing
  push:
    tags: ["v*"]

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache

      - name: Build in Debian trixie container
        run: |
          docker run --rm --privileged \
            -v "$PWD:/build" -w /build \
            -e MAC2_DESKTOP="${{ inputs.desktop || 'xfce' }}" \
            -e MAC2_BASE="${{ inputs.base || 'debian' }}" \
            -e MAC2_TOOLS="${{ inputs.tools || 'recon web passwords wireless sniffing exploit forensics reversing' }}" \
            debian:trixie sh -c '
              sed -i "s/^Components: main$/Components: main contrib non-free non-free-firmware/" /etc/apt/sources.list.d/debian.sources &&
              apt-get update &&
              { [ "$MAC2_BASE" = kali ] || ./scripts/check-packages.sh; } &&
              apt-get install -y --no-install-recommends live-build debootstrap curl gpg ca-certificates \
                xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin mtools dosfstools syslinux isolinux &&
              ./build.sh'

      - name: Checksum
        run: sha256sum *.iso | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: mac2-iso
          path: |
            *.iso
            SHA256SUMS
            build.log
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.iso
            SHA256SUMS
